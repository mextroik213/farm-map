{"type":"Feature","properties":{"fid":1,"code":"С1-С","name":"Северный","group_name":"Сектора"},"geometry":{"type":"MultiPolygon","coordinates":[[[[1400880,458175],[1400880,458521],[1401220,458521],[1401220,458175],[1400880,458175]]]]}},
{"type":"Feature","properties":{"fid":2,"code":"С2-З","name":"Западный","group_name":"Сектора"},"geometry":{"type":"MultiPolygon","coordinates":[[[[1400700,457934.5],[1400700,458521],[1400880,458521],[1400880,458175],[1400934,458175],[1400934,457934.5],[1400700,457934.5]]]]}},

const FILE_TO_GROUP = {
  "Корпуса__сооружения_и_площадки":               null,
  "Помещения_и_энергоузел":                       "Служебные",
  "Лагуны_1_и_2___контуры_прежней_карты":         "Водоёмы",

  "Р1_Р3___резервуары":                           "Резервуары",

  "ГАЗ___Газопровод___сектора_и_участки":         "Газ",
  "СС___Подземная_связь___сектора_и_участки":     "Связь",
  "КН___Канализация___сектора_и_участки":         "Канализация",
  "К1__К3__К3_1н___проектные_линии_2024":         "Канализация"
};

function buildDataFromQGIS(){
  const out = [];
  Object.entries(QGIS_DATA).forEach(([key, fc])=>{
    const features = (fc && fc.features) ? fc.features : [];

    // Приоритет: сначала whitelist (там явное указание группы), потом group_name, потом sector
    const explicit = FILE_TO_GROUP[key];

    features.forEach(f=>{
      const p = f.properties || {};
      let group;

      if(explicit !== null && explicit !== undefined){
        group = explicit;                                     // для газа/связи/канализации/электро
      } else if(p.group_name){
        group = p.group_name;                                 // для корпусов и водоёмов
      } else if(p.sector){
        group = p.sector;                                     // для воды (сектор = группа)
      } else {
        group = key;                                          // на всякий случай
      }

      p.group_name = group;
      out.push(f);
    });
  });
  return { type:"FeatureCollection", features: out };
}

let dataBounds=null;
function computeBounds(){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  DATA.features.forEach(f=>{
    const walk=c=>{
      if(Array.isArray(c[0])) return c.forEach(walk);
      if(c[0]<minX)minX=c[0]; if(c[0]>maxX)maxX=c[0];
      if(c[1]<minY)minY=c[1]; if(c[1]>maxY)maxY=c[1];
    };
    walk(f.geometry.coordinates);
  });
  dataBounds={minX,minY,maxX,maxY};
}
function project(x,y){
  const b=dataBounds,VW=1000,VH=1000;
  const dw=b.maxX-b.minX,dh=b.maxY-b.minY;
  const s=Math.min(VW/dw,VH/dh)*0.9;
  const ow=dw*s,oh=dh*s;
  const ox=(VW-ow)/2,oy=(VH-oh)/2;
  return [ox+(x-b.minX)*s,oy+(b.maxY-y)*s];
}
const SVG_NS="http://www.w3.org/2000/svg";
function el(tag,attrs){const e=document.createElementNS(SVG_NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function ringPoints(ring){return ring.map(c=>project(c[0],c[1]).join(",")).join(" ");}
function geomCenter(geom){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const walk=c=>{
    if(Array.isArray(c[0])) return c.forEach(walk);
    const p=project(c[0],c[1]);
    if(p[0]<minX)minX=p[0]; if(p[0]>maxX)maxX=p[0];
    if(p[1]<minY)minY=p[1]; if(p[1]>maxY)maxY=p[1];
  };
  walk(geom.coordinates);
  return [(minX+maxX)/2,(minY+maxY)/2];
}

function featureToShape(feature,style){
  const geom=feature.geometry;
  let shapeEl=null,labelPos=null;
  const isSector=feature.properties.group_name==="Сектора";
  if(geom.type==="Polygon"||geom.type==="MultiPolygon"){
    const polys=geom.type==="Polygon"?[geom.coordinates]:geom.coordinates;
    const g=el("g",{});
    polys.forEach(rings=>{
      const outer=rings[0];
      const poly=el("polygon",{points:ringPoints(outer),fill:style.fill,
        "fill-opacity":isSector?0.14:0.7,stroke:style.color,
        "stroke-width":isSector?2:1.5,"stroke-opacity":isSector?0.55:1,
        "stroke-linejoin":"round",class:"obj","vector-effect":"non-scaling-stroke"});
      poly.style.cursor="pointer";
      poly.addEventListener("click",ev=>{ev.stopPropagation();showPopup(feature,ev,poly);});
      g.appendChild(poly);
    });
    shapeEl=g; labelPos=geomCenter(geom);
  } else if(geom.type==="LineString"){
    const pts=geom.coordinates.map(c=>project(c[0],c[1]).join(",")).join(" ");
    const attrs={points:pts,fill:"none",stroke:style.color,"stroke-width":2,
      "stroke-linecap":"round","stroke-linejoin":"round",
      class:"obj line-obj","vector-effect":"non-scaling-stroke"};
    if(style.groupKey==="Забор") attrs["stroke-dasharray"]="6 4";
    else if(style.dash) attrs["stroke-dasharray"]=style.dash;
    shapeEl=el("polyline",attrs);
    const coords=geom.coordinates;
    const mid=coords[Math.floor(coords.length/2)];
    labelPos=project(mid[0],mid[1]);
    shapeEl.style.cursor="pointer";
    shapeEl.addEventListener("click",ev=>{ev.stopPropagation();showPopup(feature,ev,shapeEl);});
  } else if(geom.type==="Point"){
    const p=project(geom.coordinates[0],geom.coordinates[1]);
    const shape=style.pointShape||"circle";
    if(shape==="diamond"){const r=5;shapeEl=el("polygon",{points:`${p[0]},${p[1]-r} ${p[0]+r},${p[1]} ${p[0]},${p[1]+r} ${p[0]-r},${p[1]}`,fill:style.fill,stroke:style.color,"stroke-width":1.5,class:"obj point-obj","vector-effect":"non-scaling-stroke"});}
    else if(shape==="square"){const r=5;shapeEl=el("rect",{x:p[0]-r,y:p[1]-r,width:r*2,height:r*2,fill:style.fill,stroke:style.color,"stroke-width":1.5,class:"obj point-obj","vector-effect":"non-scaling-stroke"});}
    else if(shape==="triangle"){const r=6;shapeEl=el("polygon",{points:`${p[0]},${p[1]-r} ${p[0]+r},${p[1]+r*0.8} ${p[0]-r},${p[1]+r*0.8}`,fill:style.fill,stroke:style.color,"stroke-width":1.5,class:"obj point-obj","vector-effect":"non-scaling-stroke"});}
    else {shapeEl=el("circle",{cx:p[0],cy:p[1],r:4,fill:style.fill,stroke:style.color,"stroke-width":1.5,class:"obj point-obj","vector-effect":"non-scaling-stroke"});}
    labelPos=[p[0],p[1]-8];
    shapeEl.style.cursor="pointer";
    shapeEl.addEventListener("click",ev=>{ev.stopPropagation();showPopup(feature,ev,shapeEl);});
  }
  if(!shapeEl) return null;
  return {el:shapeEl,feature,labelPos};
}

function renderNode(layer){
  const wrap=document.createElement("div");
  wrap.className="node";
  const head=document.createElement("div");
  head.className="node-head";
  const cb=document.createElement("input");
  cb.type="checkbox";cb.className="cb";cb.checked=true;
  if(!layer.keys.length) cb.disabled=true;
  head.appendChild(cb);
  const sw=document.createElement("span");
  sw.className="swatch";
  if(layer.keys.length){
    const firstStyle=SUBLAYER_STYLES[layer.keys[0]];
    sw.style.background=firstStyle.fill;
    sw.style.borderColor=firstStyle.color;
  } else {sw.style.background="#e0e0e0";sw.style.borderColor="#bdbdbd";}
  head.appendChild(sw);
  const name=document.createElement("span");
  name.className="name";
  name.textContent=layer.code+" — "+layer.title;
  head.appendChild(name);
  const cnt=document.createElement("span");
  cnt.className="count";
  if(!layer.keys.length){cnt.textContent="—";}
  else {let t=0;layer.keys.forEach(k=>{t+=DATA.features.filter(f=>f.properties.group_name===k).length;});cnt.textContent=t;}
  head.appendChild(cnt);
  const lt=document.createElement("button");
  lt.type="button";lt.className="label-toggle";lt.title="Подписи слоя";lt.textContent="Aa";
  if(!layer.keys.length){lt.style.display="none";}
  else {
    if(allLabelsOff(layer)) lt.classList.add("off");
    lt.addEventListener("click",e=>{
      e.preventDefault();e.stopPropagation();
      const off=allLabelsOff(layer);
      setLabelsRecursive(layer,off);
      refreshAllLabelButtons();
    });
  }
  head.appendChild(lt);
  cb.addEventListener("change",()=>toggleLayer(layer,cb.checked));
  wrap.appendChild(head);
  return wrap;
}
function toggleLayer(layer,on){
  layer.keys.forEach(k=>{
    const lg=FM.layerGroups[k];
    if(lg){lg.g.style.display=on?"":"none";lg.visible=on;}
  });
}
function setLabelsRecursive(layer,visible){
  layer.keys.forEach(k=>{
    FM.labelsVisible[k]=visible;
    const lg=FM.layerGroups[k];
    if(lg&&lg.labelsG) lg.labelsG.style.display=(FM.labelsOn&&visible)?"":"none";
  });
}
function allLabelsOff(layer){
  if(!layer.keys.length) return true;
  return layer.keys.every(k=>FM.labelsVisible[k]===false);
}
function refreshAllLabelButtons(){
  const nodes=document.querySelectorAll("#layer-tree > .node");
  const visible=visibleLayers();
  nodes.forEach((nodeEl,idx)=>{
    const btn=nodeEl.querySelector(".label-toggle");
    if(!btn||btn.style.display==="none") return;
    const layer=visible[idx];
    if(!layer) return;
    btn.classList.toggle("off",allLabelsOff(layer));
  });
}

function showPopup(feature,ev,shapeEl){
  if(FM.selected){
    if(FM.selected.tagName==="g") FM.selected.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));
    else FM.selected.classList.remove("selected");
  }
  if(shapeEl.tagName==="g") FM.selected=shapeEl;
  else {shapeEl.classList.add("selected");FM.selected=shapeEl;}
  const p=feature.properties;
  const title=p.name||p.label||p.code||p.id||("Объект "+p.fid);
  const rows=[];
  if(p.code&&p.code!==title) rows.push(["Код",p.code]);
  if(p.label&&p.label!==title) rows.push(["Подпись",p.label]);
  if(p.id&&p.id!==title) rows.push(["ID",p.id]);
  if(p.old_label) rows.push(["Старый код",p.old_label]);
  if(p.old_code) rows.push(["Старый код",p.old_code]);
  if(p.kind) rows.push(["Тип",p.kind]);
  if(p.method) rows.push(["Способ",p.method]);
  if(p.voltage) rows.push(["Напряжение",p.voltage]);
  if(p.sector) rows.push(["Сектор",p.sector]);
  if(p.project_position) rows.push(["Позиция",p.project_position]);
  if(p.old_route) rows.push(["Старый маршрут",p.old_route]);
  if(p.length_m && p.length_m>0) rows.push(["Длина",Math.round(p.length_m*10)/10+" м"]);
  if(p.year) rows.push(["Год",p.year]);
  if(p.fid) rows.push(["FID",p.fid]);
  const table=rows.length?'<table>'+rows.map(r=>"<tr><th>"+esc(r[0])+"</th><td>"+esc(r[1])+"</td></tr>").join("")+'</table>':'';
  const html='<h3>'+esc(title)+'</h3>'+
    '<div class="cat">'+esc(p.group_name||"")+'</div>'+table+
    (p.note?'<div class="note">'+esc(p.note)+'</div>':'')+
    (p.status?'<div class="note">'+esc(p.status)+'</div>':'');
  const popup=document.getElementById("popup");
  document.getElementById("popup-body").innerHTML=html;
  popup.classList.add("visible");
  const view=document.getElementById("view").getBoundingClientRect();
  popup.style.left=Math.max(8,Math.min(ev.clientX-view.left+12,view.width-360))+"px";
  popup.style.top=Math.max(8,Math.min(ev.clientY-view.top+12,view.height-260))+"px";
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

function setupPanZoom(){
  const svg=FM.svg;
  let dragging=false,startPoint=null,startVB=null;
  function gp(ev){const r=svg.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};}
  svg.addEventListener("mousedown",e=>{
    if(e.button!==0) return;
    if(e.target.classList&&(e.target.classList.contains("obj")||e.target.closest(".obj"))) return;
    dragging=true;svg.classList.add("dragging");
    startPoint=gp(e);startVB={...FM.currentViewBox};
    e.preventDefault();
  });
  window.addEventListener("mousemove",e=>{
    if(!dragging) return;
    const p=gp(e);
    FM.currentViewBox.x=startVB.x-(p.x-startPoint.x)/svg.clientWidth*startVB.w;
    FM.currentViewBox.y=startVB.y-(p.y-startPoint.y)/svg.clientHeight*startVB.h;
    applyViewBox();
  });
  window.addEventListener("mouseup",()=>{dragging=false;svg.classList.remove("dragging");});
  svg.addEventListener("wheel",e=>{
    e.preventDefault();
    const p=gp(e);
    const cx=p.x/svg.clientWidth,cy=p.y/svg.clientHeight;
    const v=FM.currentViewBox;
    const px=v.x+cx*v.w,py=v.y+cy*v.h;
    const factor=e.deltaY<0?0.85:1/0.85;
    const nw=v.w*factor,nh=v.h*factor;
    FM.currentViewBox={x:px-cx*nw,y:py-cy*nh,w:nw,h:nh};
    applyViewBox();
  },{passive:false});
}
function applyViewBox(){const v=FM.currentViewBox;FM.svg.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`);}
function zoomBy(f){const v=FM.currentViewBox;const cx=v.x+v.w/2,cy=v.y+v.h/2;const nw=v.w*f,nh=v.h*f;FM.currentViewBox={x:cx-nw/2,y:cy-nh/2,w:nw,h:nh};applyViewBox();}
function zoomFit(){FM.currentViewBox={...FM.baseViewBox};applyViewBox();}

    title.textContent=layer.code+" — "+layer.title;
    group.appendChild(title);
    layer.keys.forEach(key=>{
      const style=SUBLAYER_STYLES[key];
      if(!style) return;
      const row=document.createElement("div");
      row.className="legend-row";
      const sw=document.createElement("span");
      sw.className="legend-swatch";

        swInner=document.createElement("span");

      } else {

      sw.appendChild(swInner);

      nm.textContent=LEGEND_NAMES[key]||key;

function svgToReal(svgX,svgY){
  const b=dataBounds,VW=1000,VH=1000;
  const dw=b.maxX-b.minX,dh=b.maxY-b.minY;
  const s=Math.min(VW/dw,VH/dh)*0.9;
  const ow=dw*s,oh=dh*s;
  const ox=(VW-ow)/2,oy=(VH-oh)/2;
  return [b.minX+(svgX-ox)/s, b.maxY-(svgY-oy)/s];
}
function screenToSvg(clientX,clientY){
  const rect=FM.svg.getBoundingClientRect();
  const v=FM.currentViewBox;
  return [
    v.x+(clientX-rect.left)/rect.width*v.w,
    v.y+(clientY-rect.top)/rect.height*v.h
  ];
}
function setupCoords(){
  const el=document.getElementById("coords");
  if(!el||!FM.svg) return;
  FM.svg.addEventListener("mousemove",e=>{
    const [sx,sy]=screenToSvg(e.clientX,e.clientY);
    const [rx,ry]=svgToReal(sx,sy);
    el.textContent="X: "+rx.toFixed(1)+"   Y: "+ry.toFixed(1);
  });
  FM.svg.addEventListener("mouseleave",()=>{
    el.textContent="—";
  });
}

function setupSearch(){
  const input=document.getElementById("search-input");
  const results=document.getElementById("search-results");
  input.addEventListener("input",()=>{
    const q=input.value.trim().toLowerCase();
    results.innerHTML="";
    if(q.length<2) return;
    const found=[];
    const allowed=allowedGroups();
    DATA.features.forEach(f=>{
      const p=f.properties;
      if(!allowed.has(p.group_name)) return;
      const hay=[p.name,p.label,p.code,p.id,p.old_label,p.old_code,p.old_route,p.sector,p.project_position]
        .filter(Boolean).join(" ").toLowerCase();
      if(hay.indexOf(q)!==-1) found.push(f);
    });
    if(!found.length){
      const li=document.createElement("li");
      li.textContent="Ничего не найдено";
      li.style.color="#6b7684";li.style.cursor="default";
      results.appendChild(li);return;
    }
    found.slice(0,25).forEach(f=>{
      const p=f.properties;
      const li=document.createElement("li");
      li.innerHTML=esc(p.name||p.label||p.code||p.id||("Объект "+p.fid))+
        '<span class="res-layer">'+esc(p.group_name||"")+'</span>';
      li.addEventListener("click",()=>focusFeature(f));
      results.appendChild(li);
    });
  });
}
function focusFeature(feature){
  const key=feature.properties.group_name;
  const lg=FM.layerGroups[key];
  if(!lg) return;
  if(!lg.visible){lg.g.style.display="";lg.visible=true;}
  const shape=lg.elements.find(e=>e.feature===feature);
  if(!shape) return;
  if(FM.selected){
    if(FM.selected.tagName==="g") FM.selected.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));
    else FM.selected.classList.remove("selected");
  }
  if(shape.el.tagName!=="g") shape.el.classList.add("selected");
  FM.selected=shape.el;
  const bbox=shape.el.getBBox();
  const pad=Math.max(bbox.width,bbox.height)*3+20;
  const cx=bbox.x+bbox.width/2,cy=bbox.y+bbox.height/2;
  FM.currentViewBox={x:cx-pad,y:cy-pad,w:pad*2,h:pad*2};
  applyViewBox();
  const view=document.getElementById("view").getBoundingClientRect();
  showPopup(feature,{clientX:view.left+view.width/2, clientY:view.top+80}, shape.el);
  document.getElementById("search-results").innerHTML="";
  document.getElementById("search-input").value=
    feature.properties.name||feature.properties.label||feature.properties.code||feature.properties.id||"";
}

function updateAuthUI(){
  const roleEl=document.getElementById("topbar-role");
  const btn=document.getElementById("auth-btn");
  const refreshBtn=document.getElementById("refresh-map-btn");
  if(isAdmin()){
    roleEl.textContent="Администратор";
    btn.textContent="Выйти";
    btn.onclick=logout;
    refreshBtn.style.display="inline-block";
  } else {
    roleEl.textContent="Гость";
    btn.textContent="Войти";
    btn.onclick=openLogin;
    refreshBtn.style.display="none";
  }
}

/* ==== Кнопка обновления схемы ==== */
const UPDATE_SERVER = "http://localhost:8765";

async function checkUpdateServer(){
  try{
    const r = await fetch(UPDATE_SERVER + "/ping", {cache:"no-store"});
    return r.ok;
  } catch(e){
    return false;
  }
}

async function refreshMapFromQGIS(){
  const btn = document.getElementById("refresh-map-btn");
  if(btn.disabled) return;

  const ok = await checkUpdateServer();
  if(!ok){
    alert(
      "Сервер обновления не запущен.\n\n" +
      "Откройте папку farm-map и запустите файл server.py\n" +
      "(двойной клик или командой python server.py).\n" +
      "Окно не закрывайте — оно должно работать, пока вы правите карту."
    );
    return;
  }

  if(!confirm("Выгрузить свежие данные из QGIS и обновить карту?\n\nЭто может занять 5–30 секунд.")) return;

  btn.disabled = true;
  btn.textContent = "⏳ Обновление…";

  try{
    const r = await fetch(UPDATE_SERVER + "/update", {method:"POST"});
    const data = await r.json();

    if(!r.ok || !data.ok){
      throw new Error((data && data.error) || ("HTTP " + r.status));
    }

    btn.textContent = "✓ Готово";
    setTimeout(()=>location.reload(), 700);
  } catch(e){
    btn.disabled = false;
    btn.textContent = "⟳ Обновить";
    alert("Не удалось обновить:\n\n" + e.message);
  }
}

document.addEventListener("DOMContentLoaded", ()=>{
  const btn = document.getElementById("refresh-map-btn");
  if(btn) btn.addEventListener("click", refreshMapFromQGIS);
});
function openLogin(){
  const m=document.getElementById("login-modal");
  document.getElementById("login-user").value="";
  document.getElementById("login-pass").value="";
  document.getElementById("login-err").textContent="";
  m.classList.add("visible");
  setTimeout(()=>document.getElementById("login-user").focus(),50);
}
function closeLogin(){document.getElementById("login-modal").classList.remove("visible");}
function tryLogin(){
  const u=document.getElementById("login-user").value.trim();
  const p=document.getElementById("login-pass").value;
  if(u===AUTH.login && p===AUTH.password){
    window.FM_role="admin";
    sessionStorage.setItem("fm_role","admin");
    closeLogin();
    rebuildAll();
  } else {document.getElementById("login-err").textContent="Неверный логин или пароль";}
}
function logout(){
  window.FM_role="guest";
  sessionStorage.removeItem("fm_role");
  rebuildAll();
}
function rebuildAll(){
  FM.layerGroups={};
  FM.labelsVisible={};
  FM.selected=null;
  renderPlan();
  renderTree();
  renderLegend();
  updateAuthUI();
  updateStatus();
}
function updateStatus(){
  const n=visibleLayers().length;
  document.getElementById("status").textContent="Объектов: "+DATA.features.length+" · слоёв: "+n;
}

document.getElementById("login-cancel").addEventListener("click",closeLogin);
document.getElementById("login-submit").addEventListener("click",tryLogin);
document.getElementById("login-user").addEventListener("keydown",e=>{if(e.key==="Enter") document.getElementById("login-pass").focus();});
document.getElementById("login-pass").addEventListener("keydown",e=>{if(e.key==="Enter") tryLogin();});
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeLogin();});
